
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title and links -->
    <title>JavaScript Calculator</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
</head>
<!-- Body -->
<body>
<!-- Calculator -->
    <main class="calculator">
        
        <h1>Calculator</h1>
        <p class="subtitle">Simple calculations, made easy</p>
<!-- Display -->
        <div class="display">
            <div id="previous-display"></div>
            <!-- Previous calculation display -->
            <input
                type="text"
                id="display"
                value="0"
                aria-label="Calculator display"
                readonly
            >
        </div>
<!-- Buttons -->
        <div class="buttons">
            <button data-action="clear" class="special">AC</button>
            <button data-action="delete" class="special">DEL</button>
            <button data-action="operator" data-value="/" class="operator">÷</button>
            <button data-action="operator" data-value="*" class="operator">×</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-action="operator" data-value="-" class="operator">−</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-action="operator" data-value="+" class="operator">+</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-action="equals" class="equals">=</button>

            <button data-action="sign">+/-</button>
            <button data-value="0">0</button>
            <button data-action="decimal">.</button>
        </div>

        <p id="message" role="status"></p>
    </main>

</body>
</html>
